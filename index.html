<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nounours & Licornes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #f3e4fb; overflow: hidden; font-family: 'Fredoka', 'Trebuchet MS', sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas { display: block; border-radius: 18px; box-shadow: 0 10px 40px rgba(160, 90, 180, 0.35); }
  #overlay { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 4%; }
  .card { background: rgba(255,255,255,0.93); border: 3px solid #f0c6ea; border-radius: 26px; padding: 22px 34px; width: min(520px, 80%); text-align: center; color: #7a3f8e; box-shadow: 0 8px 30px rgba(160,90,180,0.3); }
  h1 { margin: 0 0 4px; font-size: 42px; background: linear-gradient(90deg, #ff6fae, #b07cf0, #5aa8f0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 16px; color: #a070b0; }
  input { font: inherit; font-size: 18px; padding: 8px 14px; border-radius: 14px; border: 2px solid #e2c6f0; outline: none; color: #7a3f8e; text-align: center; }
  input:focus { border-color: #ff8fc6; }
  button { font: inherit; font-size: 17px; font-weight: 700; color: #fff; background: #ff8fc6; border: 3px solid #fff; border-radius: 18px; padding: 10px 18px; cursor: pointer; box-shadow: 0 4px 10px rgba(160,90,180,0.3); transition: transform .1s; }
  button:hover { transform: translateY(-2px); }
  button.alt { background: #9b7cf0; }
  .row { display: flex; gap: 10px; justify-content: center; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  .role { background: #fff; color: #7a3f8e; border: 3px solid #e2c6f0; box-shadow: none; }
  .role.sel { border-color: #ff6fae; background: #ffe2ef; }
  .role[data-role=blue].sel { border-color: #5aa8f0; background: #d4e9ff; }
  #code { font-size: 64px; letter-spacing: 12px; font-weight: 700; color: #ff6fae; margin: 6px 0; }
  #status { min-height: 22px; color: #c0408a; margin-top: 8px; }
  .small { font-size: 13px; color: #a090b0; }
  hr { border: none; border-top: 2px dashed #f0c6ea; margin: 14px 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <div id="overlay">
    <div class="card" id="menuMain">
      <h1>Nounours & Licornes</h1>
      <p class="sub">Un jeu à deux, chacun chez soi 💕</p>
      <div class="row"><input id="name" maxlength="14" placeholder="Ton prénom / surnom"></div>
      <hr>
      <div class="row">Tu crées la partie et tu joues :</div>
      <div class="row">
        <button class="role sel" data-role="blue">🐻 Nounours bleu</button>
        <button class="role" data-role="pink">🐻 Nounours rose</button>
      </div>
      <div class="row"><button id="btnHost">Créer une partie</button></div>
      <hr>
      <div class="row"><input id="joinCode" maxlength="4" placeholder="CODE" style="width:110px;text-transform:uppercase"><button id="btnJoin" class="alt">Rejoindre</button></div>
      <div id="status"></div>
      <p class="small">Déplacements : flèches ou ZQSD · Saut : ↑ / Z / Espace · Levier : ↓ / S · Émotes : 1 à 7 · Musique : M</p>
    </div>
    <div class="card" id="lobby" style="display:none">
      <h1>Partie créée !</h1>
      <p class="sub">Envoie ce code à ton/ta partenaire :</p>
      <div id="code">----</div>
      <div class="row"><button id="copyCode" class="alt">Copier le code</button></div>
      <p class="sub">En attente de l'autre nounours… 🦄</p>
    </div>
  </div>
</div>
<script src="js/peerjs.min.js?v=6"></script>
<script src="js/net.js?v=6"></script>
<script src="js/audio.js?v=6"></script>
<script src="js/art.js?v=6"></script>
<script src="js/ui.js?v=6"></script>
<script src="js/levels.js?v=6"></script>
<script src="js/levels2.js?v=6"></script>
<script src="js/game.js?v=6"></script>
<script src="js/minigames.js?v=6"></script>
<script src="js/main.js?v=6"></script>
</body>
</html>
